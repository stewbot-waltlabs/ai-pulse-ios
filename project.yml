# The Xcode app target, generated by XcodeGen — the .pbxproj is disposable.
name: AIPulse
options:
  bundleIdPrefix: com.waltlabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  AIPulse:
    path: .

targets:
  AIPulse:
    type: application
    platform: iOS
    # Signing lives in a gitignored xcconfig a developer creates for device
    # builds (see Configs/Signing.example.xcconfig); the simulator does not
    # need signing, and XcodeGen requires any referenced file to exist, so no
    # Debug configFile is declared here. No signing values are committed.
    configFiles:
      Release: Configs/Production.xcconfig
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: App/Assets.xcassets
    dependencies:
      - package: AIPulse
        product: AIPulseUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waltlabs.aipulse
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: AI Pulse
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"

  AIPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: AIPulse
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.waltlabs.aipulse.uitests
        TEST_TARGET_NAME: AIPulse

schemes:
  AIPulse:
    build:
      targets:
        AIPulse: all
        AIPulseUITests: [test]
    test:
      targets:
        - AIPulseUITests
